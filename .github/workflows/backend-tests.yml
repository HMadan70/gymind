name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: gymind
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: gymind
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Test-only values, not production secrets. No OPENROUTER_API_KEY is
      # set on purpose: every Coach test stubs coach_service.request_completion
      # directly, so nothing in this suite ever makes a real network call to
      # OpenRouter regardless of whether a key is configured.
      DATABASE_URL: postgresql+psycopg://gymind:ci_test_password@localhost:5432/gymind
      JWT_SECRET: ci-test-only-secret-not-for-production-use
      CORS_ORIGINS: http://localhost:8081

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create the gymind_test database
        # Reuses the same script docker-compose.yml mounts into Postgres's
        # own init directory for local dev, so CI and local dev create the
        # test database identically rather than duplicating the logic.
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGPASSWORD: ci_test_password
          POSTGRES_USER: gymind
        run: bash db-init/001-create-test-db.sh

      - name: Compile-check the backend
        working-directory: backend
        run: python -m compileall -q app tests

      - name: Run backend test suite
        working-directory: backend
        run: python -m pytest -q
