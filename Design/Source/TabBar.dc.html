<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;justify-content:space-between;align-items:flex-end;padding:10px 12px 26px;background:{{ c.bg2 }};border-top:1px solid {{ c.border }}">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="6">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1">
<span style="width:22px;height:22px;border-radius:7px;background:{{ t.icon }};display:flex;align-items:center;justify-content:center;font:700 12px Sora;color:{{ t.glyphColor }}">{{ t.glyph }}</span>
<span style="font:{{ t.weight }} 9.5px Sora;color:{{ t.fg }}">{{ t.name }}</span></div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const c = this.props.c || {};
    const active = this.props.active || 'Home';
    const tabs = ['Home','Coach','Workout','Nutrition','Progress','Profile'].map(name => {
      const on = name === active;
      return { name,
        icon: on ? c.acc : c.faint,
        glyph: name==='Coach' ? '✦' : '',
        glyphColor: on ? c.accOn : c.bg2,
        fg: on ? c.accText : c.faint,
        weight: on ? 600 : 500 };
    });
    return { c, tabs };
  }
}
</script>
</body>
</html>
