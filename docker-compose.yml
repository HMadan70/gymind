services:
  db:
    image: postgres:16
    container_name: gymind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume so data survives container restarts/rebuilds.
      # Without this, `docker compose down` would wipe your database.
      - gymind_pgdata:/var/lib/postgresql/data
    ports:
      # Exposes Postgres on the server's network too, so you can connect
      # a DB GUI tool (e.g. TablePlus/DBeaver) from your dev machine for
      # debugging. Remove this if you want the DB reachable only from
      # other containers.
      - "5432:5432"

  backend:
    build:
      context: ./backend
    container_name: gymind-backend
    restart: unless-stopped
    environment:
      # Note "db" here — that's the service name above, not "localhost".
      # Docker Compose creates an internal network where containers reach
      # each other by service name, like a hostname.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      # Mounts your local ./backend/app into the container, so code edits
      # show up immediately (paired with --reload in the Dockerfile CMD).
      # Great for active development; you'd drop this for a "frozen" prod build.
      - ./backend/app:/app/app
    depends_on:
      - db

volumes:
  gymind_pgdata:
