services:
  db:
    image: postgres:16
    container_name: gymind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume so data survives container restarts/rebuilds.
      # Without this, `docker compose down` would wipe your database.
      - gymind_pgdata:/var/lib/postgresql/data
      # Runs once, only on a brand-new volume: creates the gymind_test
      # database backend/conftest.py's test suite targets, alongside the
      # production POSTGRES_DB database. Same instance, same credentials,
      # different database name - Postgres databases are fully isolated
      # from each other, so this needs no second container. See the
      # script's own comment for why this exists.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback-only; use an SSH tunnel for remote database administration
      # (including running the test suite from a workstation - the tests
      # connect to gymind_test on this same port/host, tunneled the same
      # way as production access, opened only when actually needed rather
      # than left running: ssh -L 5433:localhost:5433 <host>).
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: gymind-backend
    restart: unless-stopped
    environment:
      # Note "db" here — that's the service name above, not "localhost".
      # Docker Compose creates an internal network where containers reach
      # each other by service name, like a hostname.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:19006}
      # Coach. Unset disables the Coach route (it returns 503); the rest of
      # the API is unaffected.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-sonnet-4.5}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  gymind_pgdata:
